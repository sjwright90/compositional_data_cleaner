[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compositional-data-cleaner"
version = "0.1.0"
description = "Water-chemistry cleaning and imputation app"
requires-python = ">=3.11"
dependencies = [
    "dash==4.1.0",
    "dash-bootstrap-components==2.0.4",
    "dash-ag-grid==35.3.0",
    "plotly==6.6.0",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "numpy==2.4.3",
    "scikit-learn==1.8.0",
    "pydantic==2.12.5",
    "pandera==0.34.1",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.2",
    "hypothesis==6.169.0",
    "ruff==0.15.11",
    "mypy==1.19.1",
    "pandas-stubs==2.3.3.260113",
]

[tool.setuptools]
packages = ["core", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "plotly.*",
    "dash.*",
    "dash_bootstrap_components.*",
    "dash_ag_grid.*",
    "diskcache.*",
]
ignore_missing_imports = true
